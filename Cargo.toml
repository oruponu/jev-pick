[package]
name = "jev-pick"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A small Discord bot that asks Jev to choose between two to four options"
license = "MIT"
keywords = ["discord", "bot", "jev", "typesafe"]
categories = ["command-line-utilities"]

[dependencies]
dotenvy = "0.15.7"
httpdate = "1.0.3"
poise = { version = "0.7.0", default-features = false, features = ["handle_panics"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Activate TLS without Poise's optional cache and chrono features. Import via Poise.
serenity = { version = "0.12.5", default-features = false, features = ["rustls_backend"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"

# Keep useful stack traces while limiting debug-symbol memory during linking.
[profile.dev]
debug = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
